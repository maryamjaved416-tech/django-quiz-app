<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.name }} - Course Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">OnlineCourse</a>
  </div>
</nav>

<div class="container mt-4">
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h1 class="card-title text-primary">{{ course.name }}</h1>
            <p class="card-text">{{ course.description }}</p>
        </div>
    </div>

    <h2 class="mb-3">Lessons</h2>
    <div class="list-group">
        {% for lesson in course.lesson_set.all %}
        <div class="list-group-item list-group-item-action">
            <h5 class="mb-1">Lesson {{ lesson.order }}: {{ lesson.title }}</h5>
            <p class="mb-1">{{ lesson.content }}</p>
        </div>
        {% empty %}
        <div class="list-group-item">Is course me abhi koi lesson nahi hai.</div>
        {% endfor %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
